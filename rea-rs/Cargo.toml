[package]
authors = ["Timofei Kazantse aka Levitanus <pianoist@ya.ru>"]
categories = ["api-bindings", "multimedia", "multimedia::audio"]
description = "A rusty version of ReaScript API"
edition = "2021"
keywords = ["reaper", "daw", "plug-in", "audio", "midi"]
license = "MIT"
name = "rea-rs"
readme = "README.md"
repository = "https://github.com/Levitanus/rea-rs"
rust-version = "1.82"
version = "1.0.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
base64 = "0.21"
bitflags = "1.3"
c_str_macro = "1.0.2"
int-enum = "0.5"
log = "0.4"
rea-rs-low = { version = "=1.0.0", path = "../low" }
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
strum = { version = "0.26", features = ["derive"] }
thiserror = {workspace = true}
anyhow = {workspace = true}
ws = "0.9.2"

[features]
default = []
egui-baseview = []

[dev-dependencies]
rea-rs-macros = { version = "=1.0.0", path = "../macros" }

[lib]
name = "rea_rs"

